name: Deploy Thanzi Coach Worker

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply thanzi_analytics --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2d878c3281833694bc40ceecd6cf889f

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2d878c3281833694bc40ceecd6cf889f
          command: deploy

# Secrets (WHATSAPP_TOKEN, VERIFY_TOKEN, GROQ_API_KEY, STATS_TOKEN, ADMIN_PHONE)
# are no longer auto-pushed here — that step was failing on every push with no
# visible reason. Set/update them directly in the Cloudflare dashboard instead:
# Workers & Pages > thanzi-coach-whatsapp > Settings > Variables and Secrets.
# They only need touching when a value actually changes, not on every deploy.
